name: CI

on:
  pull_request:
    branches: [main]
    # labeled and unlabeled rerun the check when 'buf skip breaking' is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          lint: true
          format: true
          push: false
          pr_comment: false

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: make generate
      - name: Fail when generated code is stale
        run: git diff --exit-code && test -z "$(git status --porcelain)"
      - run: go build ./...
      - run: go vet ./...

  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go mod tidy -diff
