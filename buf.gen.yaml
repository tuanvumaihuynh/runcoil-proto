# Generated Go code is committed under gen/. Plugin versions are pinned here and
# must match the requirements in go.mod (google.golang.org/protobuf, connectrpc.com/connect/v2).
version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/tuanvumaihuynh/runcoil-proto/gen
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "run", "connectrpc.com/connect/v2/cmd/protoc-gen-connect-go@v2.0.0"]
    out: gen
    opt: paths=source_relative
